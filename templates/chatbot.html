<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal E-Learner — ...</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.jpeg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>

  <!-- ══════════ NAVBAR ══════════ -->
  <header class="navbar">
    <div class="nav-logo">
      <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Legal E-Learner" />
    </div>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Home
      </a>
      <a href="{{ url_for('history') }}" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        History
      </a>
    </nav>
    <div class="nav-user" id="userMenu">
      <button class="user-btn" onclick="toggleDropdown()">
        <span class="user-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <span class="user-name">User</span>
        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-header">admin@legalsalah.com</div>
        <hr class="dropdown-divider" />
        <a href="{{ url_for('profile') }}" class="dropdown-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          My Profile
        </a>
        <a href="{{ url_for('login') }}" class="dropdown-item logout">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Log Out
        </a>
      </div>
    </div>
  </header>

  <!-- ══════════ LAYOUT ══════════ -->
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="{{ url_for('home') }}" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Home
      </a>
      <a href="{{ url_for('history') }}" class="sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        History
      </a>
    </aside>

    <!-- Main -->
    <main class="main-content">

      <div class="chat-layout">

        <!-- ── Chat Panel ── -->
        <div class="chat-panel">

          <!-- Header -->
          <div class="chat-header">
            <div>
              <h1 id="chatTitle">Legal Chat</h1>
              <p id="chatSubtitle">Ask your legal question below.</p>
            </div>
            <a href="{{ url_for('home') }}" class="back-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              Change Issue
            </a>
          </div>

          <!-- Messages -->
          <div class="chat-messages" id="chatMessages">
            <!-- Populated by JS -->
          </div>

          <!-- Input Bar -->
          <div class="chat-input-bar">
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
              <textarea id="msgInput" placeholder="Type your message..." rows="1" onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
            </div>
            <button class="btn-send" onclick="sendMessage()">
              Send
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>

        </div><!-- /.chat-panel -->

        <!-- ── Documents Panel ── -->
        <div class="docs-panel">
          <h3 class="docs-title">Relevant Legal Documents</h3>
          <div class="docs-list" id="docsList">
            <!-- Populated by JS -->
          </div>
        </div>

      </div><!-- /.chat-layout -->

    </main>
  </div>

  <script>
    // ── Issue Config ──────────────────────────────
    const issueConfig = {
      'family-law': {
        title: 'Family Law Chat',
        subtitle: 'Ask about divorce, custody, marriage & adoption.',
        docs: ['Hindu Marriage Act', 'Special Marriage Act', 'Guardians & Wards Act', 'Adoption Regulations']
      },
      'property-disputes': {
        title: 'Property Issues Chat',
        subtitle: 'Ask about land, rent & real estate legal issues.',
        docs: ['RERA Act', 'NCLT Act', 'Consumer Protection Act', 'Transfer of Property Act']
      },
      'employment': {
        title: 'Employment Issues Chat',
        subtitle: 'Ask about workplace rights, termination & contracts.',
        docs: ['Industrial Disputes Act', 'Shops & Establishments Act', 'Employees PF Act', 'Payment of Wages Act']
      },
      'consumer-rights': {
        title: 'Consumer Rights Chat',
        subtitle: 'Ask about fraud, defective products & complaints.',
        docs: ['Consumer Protection Act', 'RERA Act', 'Competition Act', 'Legal Metrology Act']
      },
      'criminal-law': {
        title: 'Criminal Law Chat',
        subtitle: 'Ask about FIR, bail, defence & criminal procedure.',
        docs: ['Indian Penal Code', 'CrPC', 'Evidence Act', 'Bail Provisions Act']
      },
      'business-law': {
        title: 'Business Law Chat',
        subtitle: 'Ask about contracts, partnerships & compliance.',
        docs: ['Companies Act 2013', 'Contract Act', 'GST Act', 'MSME Act']
      },
      'civil-rights': {
        title: 'Civil Rights Chat',
        subtitle: 'Ask about financial disputes, equality & liberties.',
        docs: ['Constitution of India', 'Civil Procedure Code', 'Limitation Act', 'RTI Act']
      },
      'others': {
        title: 'General Legal Chat',
        subtitle: 'Ask any other legal queries & general advice.',
        docs: ['Constitution of India', 'Indian Penal Code', 'CrPC', 'Consumer Protection Act']
      }
    };

    // ── Read issue from URL ───────────────────────
    const params = new URLSearchParams(window.location.search);
    const issue = params.get('issue') || 'others';
    const config = issueConfig[issue] || issueConfig['others'];

    document.getElementById('chatTitle').textContent = config.title;
    document.getElementById('chatSubtitle').textContent = config.subtitle;

    // Populate docs
    const docsList = document.getElementById('docsList');
    config.docs.forEach(doc => {
      const el = document.createElement('div');
      el.className = 'doc-item';
      el.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        ${doc}`;
      docsList.appendChild(el);
    });

    // ── Welcome message ───────────────────────────
    appendBotMessage(`Hello! I'm your RAG Legal Assistant for <strong>${config.title.replace(' Chat', '')}</strong>. I have loaded the relevant legal documents. How can I help you today?`);

    // ── Send Message ──────────────────────────────
    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      appendUserMessage(text);
      input.value = '';
      input.style.height = 'auto';

      // Typing indicator
      const typingId = appendTyping();

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          issue: issue,
          message: text
        })
      })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(result => {
          removeTyping(typingId);

          if (!result.ok) {
            appendBotMessage(`Error: ${result.data.error || 'Failed to get response.'}`);
            return;
          }

          appendBotMessage(result.data.reply);
        })
        .catch(error => {
          removeTyping(typingId);
          appendBotMessage('Something went wrong while contacting the server.');
          console.error(error);
        });
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ── Message Helpers ───────────────────────────
    function getTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendUserMessage(text) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg-row user';
      div.innerHTML = `
        <div class="bubble user-bubble">
          ${escHtml(text)}
          <span class="msg-time">${getTime()}</span>
        </div>`;
      box.appendChild(div);
      scrollBottom();
    }

    function appendBotMessage(html) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg-row bot';
      div.innerHTML = `
        <div class="bot-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="bot-content">
          <div class="bot-name">RAG Legal Assistant <span class="bot-time">${getTime()}</span></div>
          <div class="bubble bot-bubble">${html}</div>
        </div>`;
      box.appendChild(div);
      scrollBottom();
    }

    let typingCounter = 0;
    function appendTyping() {
      const id = 'typing-' + (++typingCounter);
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg-row bot';
      div.id = id;
      div.innerHTML = `
        <div class="bot-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="bot-content">
          <div class="bot-name">RAG Legal Assistant</div>
          <div class="bubble bot-bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        </div>`;
      box.appendChild(div);
      scrollBottom();
      return id;
    }

    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollBottom() {
      const box = document.getElementById('chatMessages');
      box.scrollTop = box.scrollHeight;
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Dropdown ──────────────────────────────────
    document.addEventListener('click', e => {
      if (!document.getElementById('userMenu').contains(e.target))
        document.getElementById('dropdownMenu').classList.remove('open');
    });

    function toggleDropdown() {
      document.getElementById('dropdownMenu').classList.toggle('open');
    }
  </script>

</body>

</html>
