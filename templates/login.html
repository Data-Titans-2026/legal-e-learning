<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legal E-Learning — ...</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.jpeg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui-feedback.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="{{ url_for('static', filename='ui-feedback.js') }}"></script>
</head>
<body>

  <!-- Background -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Login Card -->
  <div class="card-wrapper">
    <div class="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Legal E-Learning" class="logo-img" />
      </div>

      <h1 class="card-title">ADMIN LOGIN</h1>
      <div class="title-rule"></div>

      <!-- Form -->
      <div class="form-group">
        <label for="email" >Email</label>
        <input type="email" id="email" placeholder="admin@legalelearning.com" autocomplete="off" />
        <span class="input-line"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="off" />
          <button class="eye-btn" onclick="togglePassword()" title="Show/Hide Password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="input-line"></span>
      </div>

      <div class="forgot-wrap">
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button class="btn-signin" id="btn-signin" type="button" onclick="loginUser()">SIGN IN</button>

      <p class="signup-text">
        Don't have an account? <a href="{{ url_for('signup') }}" class="signup-link">Sign Up</a>
      </p>

    </div>
  </div>

  <script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      `;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
    }
  }

  async function loginUser() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const button = document.getElementById('btn-signin');

    if (!email || !password) {
      showToast('Please enter email and password.', 'error');
      return;
    }

    startButtonLoading(button, 'Loading...');

    try {
      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        showToast(data.error || 'Login failed.', 'error');
        return;
      }

      window.location.href = data.redirect;
    } catch (error) {
      showToast('Something went wrong while logging in.', 'error');
      console.error(error);
    } finally {
      stopButtonLoading(button);
    }
  }
</script>

</body>
</html>
